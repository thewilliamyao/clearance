<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1c1a20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clearance">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Clearance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
  :root {
    --body: #27252c; --body-hi: #34313a; --body-lo: #1b1a1f;
    --bezel: #0b0a0d; --btn: #3a3740; --btn-hi: #4a4651; --btn-lo: #24222a;
    --label: #8e8896; --label-hi: #c9c2cf; --shutter: #b6372b; --shutter-hi: #e0503f; --led: #ff4a36;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0e0d11; overflow: hidden; }
  body {
    font-family: 'Silkscreen', ui-monospace, Menlo, monospace; color: var(--label);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  #device {
    position: fixed; inset: 0; margin: auto; max-width: 560px;
    display: grid; grid-template-areas: "top" "screen" "strip" "controls"; grid-template-rows: auto auto auto 1fr;
    row-gap: 10px;
    padding: max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    background:
      radial-gradient(130% 70% at 25% 0%, var(--body-hi) 0%, var(--body) 45%, var(--body-lo) 100%);
  }
  @media (min-width: 640px) and (min-height: 700px) {
    #device { inset: 20px; max-height: 960px; border-radius: 30px; box-shadow: 0 40px 80px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.07), inset 0 -2px 0 rgba(0,0,0,.4); }
  }
  #top { grid-area: top; display: flex; align-items: center; gap: 10px; font-size: 11px; letter-spacing: .14em; padding: 0 4px; }
  #top .brand { color: var(--label-hi); }
  #top .grow { flex: 1; }
  #led { width: 8px; height: 8px; border-radius: 50%; background: #3b1714; box-shadow: inset 0 1px 2px rgba(0,0,0,.7); }
  #led.on { background: var(--led); box-shadow: 0 0 8px var(--led), 0 0 2px #fff inset; }
  #bezel {
    grid-area: screen; justify-self: center; background: var(--bezel); border-radius: 10px; padding: 10px;
    box-shadow: inset 0 2px 10px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.06);
  }
  #screen { display: block; width: 320px; height: 240px; image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; }
  #strip { grid-area: strip; display: flex; align-items: center; justify-content: space-between; padding: 2px 8px 0; font-size: 8px; letter-spacing: .22em; color: #6f6977; }
  #grille { width: 74px; height: 22px; background: radial-gradient(circle, #121116 0 1.6px, transparent 2px) 0 0 / 8px 7px; opacity: .9; }
  #controls { grid-area: controls; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; justify-items: center; min-height: 180px; }
  button { font: inherit; color: inherit; border: 0; padding: 0; margin: 0; background: none; touch-action: none; cursor: pointer; }
  button:focus { outline: none; }
  button:focus-visible { outline: 2px solid var(--label-hi); outline-offset: 2px; }

  /* D-pad */
  #dpad { position: relative; width: 150px; height: 150px; filter: drop-shadow(0 3px 0 var(--btn-lo)) drop-shadow(0 6px 8px rgba(0,0,0,.45)); }
  #dpad .d, #dpad .hub { position: absolute; width: 50px; height: 50px; background: linear-gradient(var(--btn-hi), var(--btn)); }
  #dpad .up { left: 50px; top: 0; border-radius: 8px 8px 0 0; }
  #dpad .down { left: 50px; bottom: 0; border-radius: 0 0 8px 8px; background: linear-gradient(var(--btn), var(--btn-lo)); }
  #dpad .left { left: 0; top: 50px; border-radius: 8px 0 0 8px; }
  #dpad .right { right: 0; top: 50px; border-radius: 0 8px 8px 0; }
  #dpad .hub { left: 50px; top: 50px; pointer-events: none; }
  #dpad .hub::after { content: ''; position: absolute; inset: 14px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, var(--btn), var(--btn-lo)); }
  #dpad .d::after { content: ''; position: absolute; left: 50%; top: 50%; width: 0; height: 0; border: 7px solid transparent; transform: translate(-50%, -50%); }
  #dpad .up::after { border-bottom-color: var(--label); border-top-width: 0; }
  #dpad .down::after { border-top-color: var(--label); border-bottom-width: 0; }
  #dpad .left::after { border-right-color: var(--label); border-left-width: 0; }
  #dpad .right::after { border-left-color: var(--label); border-right-width: 0; }
  #dpad .d.down, #dpad .d:active { filter: brightness(.82); }

  /* SELECT */
  #mid { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 9px; letter-spacing: .14em; }
  #select { width: 58px; height: 18px; border-radius: 9px; background: linear-gradient(var(--btn-hi), var(--btn-lo)); box-shadow: 0 2px 0 #15141a, 0 4px 6px rgba(0,0,0,.4); transform: rotate(-24deg); }
  #select.down { transform: rotate(-24deg) translateY(2px); box-shadow: 0 0 0 #15141a; }

  /* OK and the shutter */
  #right { position: relative; width: 160px; height: 160px; }
  #right .lab { position: absolute; font-size: 9px; letter-spacing: .14em; pointer-events: none; }
  #ok { position: absolute; right: 6px; top: 4px; width: 58px; height: 58px; border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, var(--btn-hi), var(--btn) 55%, var(--btn-lo)); box-shadow: 0 3px 0 #15141a, 0 6px 8px rgba(0,0,0,.45); }
  #ok.down { transform: translateY(2px); box-shadow: 0 1px 0 #15141a, 0 2px 3px rgba(0,0,0,.4); }
  #right .lab.ok { right: 24px; top: 66px; }
  #shutter { position: absolute; left: 2px; bottom: 6px; width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #8f8a94 0 58%, #4b4750 60%, #2b2930 100%); box-shadow: 0 4px 0 #121116, 0 8px 12px rgba(0,0,0,.5); }
  #shutter::after { content: ''; position: absolute; inset: 13px; border-radius: 50%;
    background: radial-gradient(circle at 38% 30%, var(--shutter-hi), var(--shutter) 55%, #7a2219); box-shadow: inset 0 -3px 6px rgba(0,0,0,.35); }
  #shutter.down { transform: translateY(3px); box-shadow: 0 1px 0 #121116, 0 3px 4px rgba(0,0,0,.45); }
  #right .lab.sh { left: 22px; bottom: -10px; }

  @media (max-width: 380px) { #dpad, #right { transform: scale(.86); } #right { margin-right: -10px; } #dpad { margin-left: -10px; } }
  #keys { display: none; grid-column: 1 / -1; font-size: 9px; letter-spacing: .1em; text-align: center; padding-top: 4px; }
  @media (hover: hover) and (pointer: fine) { #keys { display: block; } }

  /* Phones held sideways: D-pad left, screen centre, buttons right. */
  @media (orientation: landscape) and (max-height: 560px) {
    #device { max-width: none; grid-template-areas: "dpad screen right"; grid-template-columns: 1fr auto 1fr; grid-template-rows: 1fr; column-gap: 8px; }
    #top, #keys, #strip { display: none; }
    #controls { display: contents; }
    #dpad { grid-area: dpad; align-self: center; justify-self: center; }
    #right { grid-area: right; align-self: center; justify-self: center; }
    #bezel { align-self: center; }
    #mid { position: fixed; left: max(14px, env(safe-area-inset-left)); bottom: max(10px, env(safe-area-inset-bottom)); }
  }
  #cam { position: fixed; width: 2px; height: 2px; opacity: 0; pointer-events: none; left: 0; top: 0; }
  #fault { position: fixed; left: 8px; right: 8px; bottom: 8px; font: 11px ui-monospace, monospace; color: #ffb0a6; background: rgba(40,0,0,.85); padding: 8px; border-radius: 6px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="device">
  <div id="top"><span class="brand">OCR-7</span><span>FIELD RECORDER</span><span class="grow"></span><span>REC</span><span id="led"></span></div>
  <div id="bezel"><canvas id="screen" width="320" height="240" aria-label="Camera screen"></canvas></div>
  <div id="strip"><span>PROPERTY OF THE OFFICE OF CIVIC RECORD</span><span id="grille"></span></div>
  <div id="controls">
    <div id="dpad">
      <button class="d up" data-btn="UP" aria-label="Up"></button>
      <button class="d left" data-btn="LEFT" aria-label="Left"></button>
      <button class="d right" data-btn="RIGHT" aria-label="Right"></button>
      <button class="d down" data-btn="DOWN" aria-label="Down"></button>
      <span class="hub"></span>
    </div>
    <div id="mid"><button id="select" data-btn="SELECT" aria-label="Select"></button><span>SELECT</span></div>
    <div id="right">
      <button id="ok" data-btn="OK" aria-label="OK"></button><span class="lab ok">OK</span>
      <button id="shutter" data-btn="SHUTTER" aria-label="Shutter"></button><span class="lab sh">SHUTTER</span>
    </div>
    <div id="keys">KEYS: ARROWS · ENTER = OK · SPACE = SHUTTER · ESC = SELECT</div>
  </div>
</div>
<video id="cam" playsinline muted autoplay></video>
<noscript><p style="color:#ddd;padding:20px">The unit needs JavaScript.</p></noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
